name: Core foundation

on:
  pull_request:
  push:
    branches: [feature/core-foundation]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: raceatlas
          POSTGRES_PASSWORD: raceatlas
          POSTGRES_DB: raceatlas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U raceatlas -d raceatlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://raceatlas:raceatlas@127.0.0.1:5432/raceatlas_test
      TEST_DATABASE_URL: postgresql+psycopg://raceatlas:raceatlas@127.0.0.1:5432/raceatlas_test
      RACEATLAS_DISPOSABLE_DB: "1"
      RACEATLAS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check raceatlas migrations tests/backend
      - run: python -m ruff format --check raceatlas migrations tests/backend
      - run: node --test tests/contracts/contracts.test.mjs
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: python -m playwright install --with-deps chromium
      # Tests run upgrade/check/downgrade/upgrade/check, constraints and compiled React E2E.
      - run: python -m pytest -v
