name: Core foundation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  push:
    branches: [main, feature/core-foundation]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'development' || 'integrated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: raceatlas
          POSTGRES_PASSWORD: raceatlas
          POSTGRES_DB: raceatlas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U raceatlas -d raceatlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://raceatlas:raceatlas@127.0.0.1:5432/raceatlas_test
      TEST_DATABASE_URL: postgresql+psycopg://raceatlas:raceatlas@127.0.0.1:5432/raceatlas_test
      RACEATLAS_DISPOSABLE_DB: "1"
      RACEATLAS_ENV: test
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and current PR head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raceatlas-results"
          cat > "$RUNNER_TEMP/raceatlas-check-source.sh" <<'BASH'
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo '::error::Checkout does not match the expected source SHA.'
            exit 1
          fi
          if [[ -n "${PR_NUMBER:-}" ]]; then
            observed="$(GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraHeader= ls-remote --exit-code origin "refs/pull/$PR_NUMBER/head" | cut -f1)"
            if [[ "$observed" != "$EXPECTED_SOURCE_SHA" ]]; then
              echo '::error::PR head changed; this run cannot validate the current source.'
              exit 1
            fi
          fi
          printf 'Verified source: %s\n' "$actual"
          BASH
          bash "$RUNNER_TEMP/raceatlas-check-source.sh"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Select conservative development seams or complete integration
        id: selection
        run: python ops/ci_selection.py --plan "$RUNNER_TEMP/raceatlas-selection.json"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check raceatlas migrations tests/backend ops/ci_selection.py
      - run: python -m ruff format --check raceatlas migrations tests/backend ops/ci_selection.py
      - run: node --test tests/contracts/contracts.test.mjs
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - if: steps.selection.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      # Integrated always discovers ALL tests, including migration/compiled-browser fixtures.
      - name: Run selected backend validation (never an integration gate in development mode)
        run: python ops/ci_selection.py --run "$RUNNER_TEMP/raceatlas-selection.json" --junit "$RUNNER_TEMP/raceatlas-results/backend.xml"
      - name: Recheck source and current PR head after validation
        shell: bash
        run: bash "$RUNNER_TEMP/raceatlas-check-source.sh"
      - name: Stage only known synthetic browser screenshots on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raceatlas-results/screenshots"
          for name in desktop mobile mobile-details summit cluster-details dem-failure webgl-failure; do
            source=".local-tools/lot5-screenshots/$name.png"
            if [[ -f "$source" && ! -L "$source" ]]; then
              cp -- "$source" "$RUNNER_TEMP/raceatlas-results/screenshots/$name.png"
            fi
          done
          for name in desktop mobile day-details candidates; do
            source=".local-tools/lot6-screenshots/$name.png"
            if [[ -f "$source" && ! -L "$source" ]]; then
              cp -- "$source" "$RUNNER_TEMP/raceatlas-results/screenshots/calendar-$name.png"
            fi
          done
          for name in dialog-desktop reset-form-mobile account-reset account-mobile; do
            source=".local-tools/accounts-ui-screenshots/$name.png"
            if [[ -f "$source" && ! -L "$source" ]]; then
              cp -- "$source" "$RUNNER_TEMP/raceatlas-results/screenshots/accounts-$name.png"
            fi
          done
      - name: Upload synthetic failure evidence for one day
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-validation-${{ env.EXPECTED_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raceatlas-results
          if-no-files-found: ignore
          retention-days: 1
      - name: Summarize the exact source validation
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          VALIDATION_MODE: ${{ steps.selection.outputs.mode }}
          BACKEND_MODE: ${{ steps.selection.outputs.backend }}
          SELECTION_REASON: ${{ steps.selection.outputs.reason }}
        run: |
          printf '## RaceAtlas validation\n\nSource SHA: %s\n\nResult: %s\n' "$EXPECTED_SOURCE_SHA" "$VALIDATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '\nMode: %s; backend: %s; reason: %s\n' \
            "$VALIDATION_MODE" "$BACKEND_MODE" "$SELECTION_REASON" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VALIDATION_MODE" != integrated ]]; then
            printf '\nDevelopment evidence only: a green run is NOT the merge gate.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VALIDATION_STATUS" == failure ]]; then
            echo "::error title=RaceAtlas validation failed::Inspect the failing step and synthetic artifacts for source $EXPECTED_SOURCE_SHA."
          fi
